name: JMeter Performance Tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  performance-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Download and extract JMeter
        run: |
          curl -L https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip -o jmeter.zip
          tar -xf jmeter.zip

      - name: Run JMeter Performance Suite
        shell: cmd
        run: |
          set JMETER_HOME=%CD%\apache-jmeter-5.6.3
          scripts\run_test.bat

      - name: Upload JMeter Reports
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-performance-reports
          path: results/reports
